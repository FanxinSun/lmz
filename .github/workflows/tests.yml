name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything back, so the token gets read access and no more.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it rather than paying for
# both; the older answer is worthless the moment a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A lossless compressor's only real claim is that the bytes come back. These
# jobs exist so that claim is checked on every push rather than asserted in a
# README, across every interpreter the package says it supports -- including
# the free-threaded builds, where lmz lifts its own thread caps and therefore
# runs genuinely different code.
jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        # Extra combinations, not a second dimension: the interpreter sweep is
        # about Python, so it only needs one machine, while these are about the
        # machine and only need one interpreter. macos-latest is Apple Silicon,
        # which makes it the only job that ever compiles the NEON kernels or the
        # -dynamiclib link line -- both shipped, neither previously built
        # anywhere. ubuntu-24.04-arm holds the OS fixed so a failure says
        # "arm64" or "Darwin" rather than leaving it ambiguous.
        #
        # The free-threaded arm64 entry is the only one that crosses the two
        # axes. Every other no-GIL job runs on x86, which is total-store-order
        # and therefore the forgiving case; arm64 reorders far more, so a race
        # that is benign there can be real here. It is also the only place the
        # threaded FUSE server runs under both conditions at once, because those
        # tests need a Linux kernel -- and that server is where the one race
        # found so far actually lived.
        include:
          - os: macos-latest
            python: "3.14"
          - os: ubuntu-24.04-arm
            python: "3.14"
          - os: ubuntu-24.04-arm
            python: "3.14t"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Without fuse3 the mount and filesystem tests skip themselves rather
      # than fail, which would quietly hide the half of the suite that
      # exercises the read path. macOS has no /dev/fuse and lmz declines to
      # mount there at all, so on that job the same tests skip by design.
      - name: Install fuse3
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3
          ls -l /dev/fuse

      - name: Report the active backends
        run: python -m lmz doctor

      # The vector encoders have to write byte for byte what the scalar loop
      # writes, or an archive depends on the machine that made it. That is
      # checked for whichever one this machine has -- and then for the arm64
      # one as well, on every machine, because scratchpad/neonshim stands a
      # portable arm_neon.h in front of the kernel's include and the shipped
      # source compiles down its NEON path anywhere. Only the timings from
      # that second build are meaningless; the bytes are the real ones.
      - name: The vector encoder writes the scalar loop's bytes
        run: |
          cc -O3 -o encbench scratchpad/encbench.c
          ./encbench
          cc -O2 -DLMZ_FORCE_NEON -Iscratchpad/neonshim -o encbench-neon \
              scratchpad/encbench.c
          ./encbench-neon

      # A kernel that fails to build is silent on purpose: lmz falls back to
      # Python and keeps working. That is right for users and useless for CI --
      # without this, the two jobs added to cover NEON would go green while
      # running the same fallback bytes as every other job.
      - name: Require the NEON kernel
        if: runner.arch == 'ARM64'
        run: |
          python -c "
          from lmz import kernels
          isa = kernels.backend()
          print('kernel backend:', isa)
          assert isa == 'native:neon', isa
          "

      - name: Run the suite
        run: python tests/test_lmz.py

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the metadata PyPI will render
        run: python -m twine check dist/*

      # The wheel has to work on its own, away from the source tree: the
      # native kernel is compiled into the installed package on first use,
      # and that path is easy to break without noticing.
      - name: Install the wheel and round-trip through it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/lmz --version
          cd /tmp && /tmp/v/bin/python -c "
          import hashlib, lmz, os, tempfile
          d = tempfile.mkdtemp()
          src = os.path.join(d, 'weights.bin')
          open(src, 'wb').write(bytes(range(256)) * 8192)
          lmz.compress(src, src + '.lmz')
          lmz.decompress(src + '.lmz', src + '.out')
          a = hashlib.sha256(open(src, 'rb').read()).hexdigest()
          b = hashlib.sha256(open(src + '.out', 'rb').read()).hexdigest()
          assert a == b, 'the installed wheel did not round-trip'
          print('round-trip OK,', lmz.backends())
          "

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
