[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name only: the import and the command are both `lmz`. The bare
# name on PyPI belongs to an unrelated package (listmapzip), so the tin says
# lmzip and everything inside it does not.
name = "lmzip"
version = "1.3.0"
description = "Lossless compression for model weights: 34.7% off BF16, byte for byte, with a store you can read through"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fanxin Sun" }]
keywords = [
    "compression", "lossless", "safetensors", "gguf", "llm", "model-weights",
    "bfloat16", "fp8", "quantization", "zstd", "rans", "entropy-coding",
    "fuse", "filesystem", "model-store", "checkpoint", "machine-learning",
    "cuda", "gpu",
]
classifiers = [
    "Development Status :: 4 - Beta",
    # The CUDA decoder is optional and builds itself; nothing here is a
    # dependency. The classifier is so PyPI's filter finds it, not a claim
    # that a card is required.
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: System :: Filesystems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No runtime dependencies. Zstandard comes from the standard library on
# Python 3.14+; on older versions install the optional 'zstd' extra, without
# which the tool falls back to deflate.
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard>=0.21"]

[project.urls]
Homepage = "https://github.com/FanxinSun/lmz"
Repository = "https://github.com/FanxinSun/lmz"
Issues = "https://github.com/FanxinSun/lmz/issues"
Funding = "https://buymeacoffee.com/fanxinsun"

[project.scripts]
lmz = "lmz.cli:main"

[tool.setuptools]
packages = ["lmz", "lmz.native", "lmz.gpu"]

# Only source ships. Both shared libraries are built on first use into the
# installed package directory, so the wheel stays pure Python and portable
# and nothing platform-specific is ever uploaded.
#
# lmz.gpu is the CUDA decoder and it is optional in every direction: the wheel
# carries a .cu file and no CUDA, installing needs no toolkit, importing lmz
# does not import it, and a machine with neither nvcc nor a device decodes on
# the CPU exactly as before. It builds itself the first time something asks,
# which is the same bargain lmz.native already makes with a C compiler.
[tool.setuptools.package-data]
"lmz.native" = ["*.c"]
"lmz.gpu" = ["*.cu"]
