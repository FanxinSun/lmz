[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmz"
version = "0.8.0"
description = "Fast lossless compression for large model weights"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["compression", "safetensors", "gguf", "llm", "model-weights", "zstd"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No runtime dependencies. Zstandard comes from the standard library on
# Python 3.14+; on older versions install the optional 'zstd' extra, without
# which the tool falls back to deflate.
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard>=0.21"]

[project.scripts]
lmz = "lmz.cli:main"

[tool.setuptools]
packages = ["lmz", "lmz.native"]

[tool.setuptools.package-data]
"lmz.native" = ["*.c"]
